name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.5
      - name: Décompresser le projet
        run: |
          mkdir src_project
          unzip -q DYLAN_VPN.zip -d src_project
          DIR=\( (dirname " \)(find src_project -name settings.gradle.kts | head -1)")
          echo "DIR=$DIR" >> $GITHUB_ENV
      - name: Compiler l'APK
        run: cd "$DIR" && gradle assembleDebug --no-daemon
      - name: Publier l'APK dans Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp "$DIR/app/build/outputs/apk/debug/app-debug.apk" DylanVPN.apk
          gh release delete latest --yes --cleanup-tag --repo ${{ github.repository }} || true
          gh release create latest DylanVPN.apk --repo ${{ github.repository }} --target ${{ github.sha }} --title "DYLAN VPN (dernier build)" --notes "APK debug"
